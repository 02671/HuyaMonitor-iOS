name: Build iOS app

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project HuyaMonitor.xcodeproj \
            -target HuyaMonitor \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/HuyaMonitor.app Payload/
          zip -qry HuyaMonitor-unsigned.ipa Payload
          ls -lh HuyaMonitor-unsigned.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: HuyaMonitor-unsigned-ipa
          path: ios/HuyaMonitor-unsigned.ipa
